# GENERATED from tokens.toml — manual edits will be overwritten.
# Source: tokens.toml, generator: scripts/render-theme
#
# Installed to /etc/xdg/hypr/hyprlock.conf. Hyprlock looks in XDG_CONFIG_DIRS
# and /etc/xdg itself, so no wrapper is needed: your ~/.config/hypr/hyprlock.conf overrides it.
#
# Currently minimal — a solid background and an input field. This is a canvas for
# pixel art once we reach the visual design stage (see DESIGN.md).

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(14100d)
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 16

    outer_color = rgb(e2733f)
    inner_color = rgb(1c1612)
    font_color = rgb(f2e6d8)
    check_color = rgb(e2733f)
    fail_color = rgb(f0435a)

    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true

    # Always show the field. By default, hyprlock hides an empty field, leaving users
    # with a black screen and a clock, unsure where to type their password.
    fade_on_empty = false

    placeholder_text = <span foreground="##a39483">password</span>
    fail_text = <span foreground="##f0435a">wrong password</span>

    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(f2e6d8)
    font_size = 72
    font_family = Adwaita Sans
    position = 0, 100
    halign = center
    valign = center
}
