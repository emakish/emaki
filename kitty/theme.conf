# The terminal's look: the monospace font and a see-through background, so the compositor's
# blur shows behind it. dynamic_background_opacity lets each window change it (Ctrl+Shift+A,
# then M more, L less, 1 opaque, D back to this value).
font_family Iosevka Nerd Font Mono
font_size 12
background_opacity 0.75
dynamic_background_opacity yes

# The accent chosen in Settings, written by the session (kitty ignores a missing file
# and reloads on SIGUSR1). Without it the accent above, the default, stays.
include ${XDG_RUNTIME_DIR}/emaki-settings/accent/kitty.conf
