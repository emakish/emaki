GRUB_BTRFS_SUBMENUNAME="Restore from a snapshot"
# emaki-snapshot-menu reads these four columns to write plain titles.
GRUB_BTRFS_TITLE_FORMAT=("date" "snapshot" "type" "description")
# The state after an update is what a person restores away from; "before update" stays.
GRUB_BTRFS_IGNORE_SNAPSHOT_TYPE=("post")
# Upstream stops after 50 snapshots, newest first, before emaki-snapshot-menu can keep every
# "before update" one and drop old automatic ones. snapper's cleanup limits how many exist.
GRUB_BTRFS_LIMIT="1000"
# Snapshot entries carry the startup logo's arguments too. grub-btrfs reads /etc/default/grub
# again after this file and reads no /etc/default/grub.d drop-in, so what 50-emaki-splash.cfg
# adds to the normal entries is gone by then; GRUB_BTRFS_SNAPSHOT_KERNEL_PARAMETERS survives.
# Without plymouth.use-legacy-input a snapshot whose initramfs has Plymouth would read the disk
# password in the first XKBLAYOUT. The drop-in stays the one place that decides.
if [ -r "${sysconfdir:-/etc}/default/grub.d/50-emaki-splash.cfg" ]; then
    for _emaki_snapshot_argument in $(GRUB_CMDLINE_LINUX_DEFAULT=; . "${sysconfdir:-/etc}/default/grub.d/50-emaki-splash.cfg"; printf '%s' "$GRUB_CMDLINE_LINUX_DEFAULT"); do
        case " ${GRUB_BTRFS_SNAPSHOT_KERNEL_PARAMETERS-} " in
            *" $_emaki_snapshot_argument "*) ;;
            *) GRUB_BTRFS_SNAPSHOT_KERNEL_PARAMETERS="${GRUB_BTRFS_SNAPSHOT_KERNEL_PARAMETERS:+$GRUB_BTRFS_SNAPSHOT_KERNEL_PARAMETERS }$_emaki_snapshot_argument" ;;
        esac
    done
    unset _emaki_snapshot_argument
fi
