# Installed as /etc/mkinitcpio.conf.d/50-emaki-splash.conf. Starts Plymouth (Emaki's startup
# logo) in the initramfs right after udev, before the encrypt hook, so a disk password prompt
# from that hook is drawn by the splash. Nothing changes when Plymouth's hook is not installed,
# when HOOKS is the old string form (mkinitcpio splits it later; editing it here would turn it
# into one hook name), when HOOKS already name plymouth (the administrator placed it), when
# HOOKS have no busybox udev hook (a systemd-based initramfs), or for the live image's archiso
# hooks. mkinitcpio may source its configuration more than once; a second pass changes nothing.
if [[ -e /usr/lib/initcpio/install/plymouth ]] &&
   [[ $(declare -p HOOKS 2>/dev/null) == 'declare -a'* ]] &&
   [[ " ${HOOKS[*]-} " == *" udev "* ]] &&
   [[ " ${HOOKS[*]-} " != *" plymouth "* ]] &&
   [[ " ${HOOKS[*]-} " != *" archiso "* ]]; then
    _emaki_splash_hooks=()
    for _emaki_splash_hook in "${HOOKS[@]}"; do
        _emaki_splash_hooks+=("$_emaki_splash_hook")
        [[ $_emaki_splash_hook != udev ]] || _emaki_splash_hooks+=(plymouth)
    done
    HOOKS=("${_emaki_splash_hooks[@]}")
    unset _emaki_splash_hook _emaki_splash_hooks
fi
