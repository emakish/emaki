# Installed as /etc/default/grub.d/50-emaki-splash.cfg; grub-mkconfig reads it after
# /etc/default/grub (drop-in support is Arch's own patch to grub-mkconfig; upstream GRUB reads
# only /etc/default/grub). Plymouth draws Emaki's startup logo only when the kernel command line
# has "splash"; without it Plymouth shows the boot messages. plymouth.use-legacy-input makes
# Plymouth read keys through the text console's keymap (the initramfs keymap hook loads KEYMAP
# from /etc/vconsole.conf), as the text prompt without Plymouth does. Without it Plymouth reads
# keys in the first XKBLAYOUT, and with Russian or Ukrainian first the disk password, typed on
# the English (US) keys, would come out in Cyrillic. To see the messages instead, remove only
# "splash" from the list below (Plymouth still asks for the password then) and run
# emaki-boot-refresh. Snapshot entries take the same list (/usr/share/emaki/boot/grub-btrfs.conf).
for _emaki_splash_argument in splash plymouth.use-legacy-input; do
    case " ${GRUB_CMDLINE_LINUX_DEFAULT-} " in
        *" $_emaki_splash_argument "*) ;;
        *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }$_emaki_splash_argument" ;;
    esac
done
unset _emaki_splash_argument
