# Root controls the parent; only each account and the greeter can traverse its copy.
# Per-user users/<account> (2750 account:greeter) is made by enable-greeter, never here.
d /var/lib/emaki-greeter 0755 root root -
d /var/lib/emaki-greeter/users 0711 root root -
d /var/lib/emaki-greeter/home 0700 greeter greeter -
d /var/lib/emaki-greeter/state 0700 greeter greeter -
d /var/lib/emaki-greeter/cache 0700 greeter greeter -
d /var/lib/emaki-greeter/config 0700 greeter greeter -
d /var/lib/emaki-greeter/data 0700 greeter greeter -

# Password-free final frame; token names are unlisted but readable by the session.
d /var/lib/emaki-greeter/handoff 0711 greeter greeter 1h
