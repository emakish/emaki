LABEL arch_nbd_safe
TEXT HELP
Disable kernel modesetting for graphics troubleshooting.
A graphical session may be unavailable; use the text console.
ENDTEXT
MENU LABEL Emaki (basic display, text console, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y %KERNEL_PARAMS% copytoram=n nomodeset
SYSAPPEND 3

