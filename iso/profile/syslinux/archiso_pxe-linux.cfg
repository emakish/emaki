LABEL arch_nbd
TEXT HELP
Boot the Emaki 0.2.0 alpha install medium using NBD.
It allows you to install Emaki 0.2.0 alpha or perform system maintenance.
ENDTEXT
MENU LABEL Emaki 0.2.0 alpha install medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y %KERNEL_PARAMS% copytoram=n
SYSAPPEND 3

