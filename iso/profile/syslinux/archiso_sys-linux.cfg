LABEL arch_safe
TEXT HELP
Disable kernel modesetting for graphics troubleshooting.
A graphical session may be unavailable; use the text console.
Installing requires UEFI; choose the USB stick's UEFI boot entry.
ENDTEXT
MENU LABEL Emaki (basic display, text console)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% copytoram=n nomodeset
