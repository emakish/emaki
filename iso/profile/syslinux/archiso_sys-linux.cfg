LABEL arch
TEXT HELP
Boot the Emaki 0.1.1 install medium on BIOS.
It allows you to install Emaki 0.1.1 or perform system maintenance.
ENDTEXT
MENU LABEL Emaki 0.1.1 install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% copytoram=n

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the Emaki 0.1.1 install medium on BIOS with speakup screen reader.
It allows you to install Emaki 0.1.1 or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Emaki 0.1.1 install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS% copytoram=n
