# https://www.supergrubdisk.org/wiki/Loopback.cfg

# Search for the ISO volume
search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

# Preserve the firmware's preferred mode, with a readable console on failure.
terminal_input console
terminal_output console
set color_normal=light-gray/black
set color_highlight=black/light-gray
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray
if [ "${grub_platform}" == 'efi' ]; then
    insmod efi_gop
else
    insmod all_video
fi
if loadfont /boot/grub/menu.pf2; then
    set gfxmode=auto
    set gfxterm_font="DejaVu Sans Mono Regular 30"
    if terminal_output gfxterm; then
        insmod gfxterm_background
        insmod png
        background_image --mode stretch /boot/grub/background.png
    else
        terminal_output console
        unset gfxterm_font
    fi
fi

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

# Get the lowercase UEFI machine type short-name to use for architecture-specific tools
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' ]; then
        uefi_machine_type_lower='x64'
    elif [ "${grub_cpu}" == 'i386' ]; then
        uefi_machine_type_lower='ia32'
    elif [ "${grub_cpu}" == 'arm64' ]; then
        uefi_machine_type_lower='aa64'
    elif [ "${grub_cpu}" == 'riscv64' ]; then
        uefi_machine_type_lower='riscv64'
    elif [ "${grub_cpu}" == 'loongarch64' ]; then
        uefi_machine_type_lower='loongarch64'
    fi
fi

# Set default menu entry
default=archlinux
timeout=15
timeout_style=menu


# Menu entries

menuentry "Emaki 0.3.0 alpha install medium (%ARCH%, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id 'archlinux' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" %KERNEL_PARAMS% copytoram=n
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Emaki 0.3.0 alpha install medium (LTS, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id 'archlinux-lts' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" %KERNEL_PARAMS% copytoram=n
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
}


# Disabling kernel modesetting may leave only the text console.
menuentry "Emaki (basic display, text console)" --class arch --class gnu-linux --class gnu --class os --id 'archlinux-safe' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" %KERNEL_PARAMS% copytoram=n nomodeset
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}


if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'x86_64' -a -f '/boot/memtest86+/memtest.efi' ]; then
    menuentry 'Memtest86+' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest.efi
    }
fi
if [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry 'Memtest86+' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi

if [ "${grub_platform}" == 'efi' ]; then
    if [ -f "/shell${uefi_machine_type_lower}.efi" ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shell${uefi_machine_type_lower}.efi
        }
    fi

    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}
