# Emaki: greetd reads our config instead of the greetd package's /etc/greetd/config.toml.
# Installed to /usr/lib/systemd/system/greetd.service.d/emaki.conf (make install).
# Empty ExecStart= resets the command from greetd.service; the second line sets ours.
# This file does not enable the service.
[Unit]
Wants=emaki-drm-hold.service
After=emaki-drm-hold.service

[Service]
# Keep PAM messages parseable without changing Unicode character handling.
Environment=LC_MESSAGES=C
UnsetEnvironment=LC_ALL
ExecStart=
ExecStart=/usr/bin/greetd --config /usr/share/emaki/greetd/config.toml
