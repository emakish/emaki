else
  search --no-floppy --fs-uuid --set=root 442946be-2205-4306-89be-eb862636ab14
fi
insmod png
background_image -m stretch "/@/usr/share/emaki/grub/background.png"
if [ x$feature_timeout_style = xy ] ; then
  set timeout_style=menu
